name: Sync Upstream, Validate and Release

on:
  push:
    branches:
      - main

  schedule:
    # Check Equicord upstream every 6 hours.
    - cron: "17 */6 * * *"

  workflow_dispatch:
    inputs:
      force_release:
        description: "Build a release even when upstream has no new commits"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: equicordplus-sync-release
  cancel-in-progress: false

jobs:
  sync-build-release:
    name: Sync, validate, build and release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout EquicordPlus
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge Equicord upstream locally
        id: sync
        if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # README.md is fork-owned (see .gitattributes). Keep the
          # EquicordPlus README whenever upstream changes its own README.
          git config merge.equicordplus-readme.name "Keep EquicordPlus README"
          git config merge.equicordplus-readme.driver true

          # Explicit package policy: fork metadata/custom-only entries stay;
          # upstream version, scripts, dependencies and toolchain take priority.
          git config merge.equicordplus-package.name "Merge fork metadata with upstream toolchain"
          git config merge.equicordplus-package.driver "node scripts/mergePackageJson.mjs %O %A %B"
          # The lockfile is regenerated from the combined manifest after merge.
          git config merge.equicordplus-lock.name "Regenerate combined pnpm lockfile"
          git config merge.equicordplus-lock.driver "cp %B %A"
          git config merge.equicordplus-workspace.name "Merge upstream workspace catalog with fork-only entries"
          git config merge.equicordplus-workspace.driver "node scripts/mergePnpmWorkspace.mjs %O %A %B"

          # Merge upstream constants while retaining EquicordPlus-only metadata.
          # Use a temporary attributes file so this policy is available before
          # the merge starts and does not need to alter upstream's .gitattributes.
          cat > /tmp/equicordplus-merge-attributes <<'ATTR'
          src/utils/constants.ts merge=equicordplus-constants
          ATTR
          git config core.attributesFile /tmp/equicordplus-merge-attributes
          git config merge.equicordplus-constants.name "Merge upstream constants with EquicordPlus metadata"
          # The driver lives in scripts/merge-constants.js (tracked, testable)
          # rather than inline here. It layers EquicordPlus-only constants on top
          # of upstream/head's constants.ts and never aborts the sync on a
          # refactored insertion point.
          git config merge.equicordplus-constants.driver "node scripts/merge-constants.js %O %A %B"

          git remote add upstream https://github.com/Equicord/Equicord.git
          git fetch --no-tags upstream main

          BEFORE="$(git rev-parse HEAD)"
          cp pnpm-workspace.yaml /tmp/equicordplus-pnpm-workspace.yaml
          # Preserve the fork's Stylelint configuration across upstream merges.
          cp .stylelintrc.json /tmp/equicordplus-stylelintrc.json
          echo "Current EquicordPlus commit: $BEFORE"
          echo "Current Equicord upstream: $(git rev-parse upstream/main)"

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Fork already contains the latest Equicord commits."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "New upstream commits found."
          echo "Attempting automatic merge locally..."

          set +e
          git merge --no-edit upstream/main
          MERGE_STATUS=$?
          set -e

          if [ "$MERGE_STATUS" -ne 0 ]; then
            echo "::error::Equicord upstream could not be merged automatically."

            {
              echo "## Upstream merge conflict"
              echo
              echo "The automatic merge was aborted and nothing was pushed."
              echo
              echo "Conflicting files:"
              echo
              git diff --name-only --diff-filter=U |
                sed 's/^/- /' |
                sed 's/$//'
            } >> "$GITHUB_STEP_SUMMARY"

            git merge --abort
            exit 1
          fi

          # Preserve fork-managed Actions workflows. The workflow token cannot
          # create/update workflow files from an upstream merge (GitHub requires
          # the separate `workflows` permission), so upstream workflow changes
          # are intentionally excluded from this automated sync.
          git checkout "$BEFORE" -- .github/workflows

          # Git may auto-resolve non-overlapping workspace edits by accepting
          # upstream deletions. Explicitly union fork-only catalog entries back
          # into the upstream workspace configuration before installing.
          node scripts/mergePnpmWorkspace.mjs /dev/null /tmp/equicordplus-pnpm-workspace.yaml pnpm-workspace.yaml
          cp /tmp/equicordplus-pnpm-workspace.yaml pnpm-workspace.yaml
          cp /tmp/equicordplus-stylelintrc.json .stylelintrc.json

          AFTER="$(git rev-parse HEAD)"

          if [ "$BEFORE" = "$AFTER" ]; then
            echo "Merge produced no changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Merge succeeded locally."
          echo "The merge will be pushed only after all validation succeeds."
          echo "changed=true" >> "$GITHUB_OUTPUT"

          {
            echo "## Upstream merge prepared"
            echo
            echo "Merged Equicord/Equicord:main locally."
            echo
            echo "Candidate commit: $AFTER"
            echo
            echo "The candidate will be pushed only if validation succeeds."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Decide whether to build
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SYNC_CHANGED: ${{ steps.sync.outputs.changed }}
          FORCE_RELEASE: ${{ github.event.inputs.force_release || 'false' }}
        run: |
          set -euo pipefail

          BUILD=false

          if [ "$EVENT_NAME" = "push" ]; then
            BUILD=true
          elif [ "$SYNC_CHANGED" = "true" ]; then
            BUILD=true
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] &&
               [ "$FORCE_RELEASE" = "true" ]; then
            BUILD=true
          fi

          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Build required: $BUILD"

          {
            echo "## Build decision"
            echo
            echo "- Event: $EVENT_NAME"
            echo "- Upstream changed: ${SYNC_CHANGED:-false}"
            echo "- Force release: $FORCE_RELEASE"
            echo "- Build: $BUILD"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install pnpm
        if: steps.gate.outputs.build == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node
        if: steps.gate.outputs.build == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install and reconcile dependencies
        if: steps.gate.outputs.build == 'true'
        id: dependencies
        shell: bash
        run: |
          set -euo pipefail
          # Resolve the combined fork/upstream manifest, then verify that the
          # generated lockfile supports a clean frozen installation.
          pnpm install --no-frozen-lockfile
          pnpm install --frozen-lockfile

          if git diff --quiet -- pnpm-lock.yaml; then
            echo "lockfile_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "lockfile_changed=true" >> "$GITHUB_OUTPUT"
            echo "pnpm-lock.yaml was reconciled and will be pushed only after validation."
          fi

      - name: Build desktop artifacts
        if: steps.gate.outputs.build == 'true'
        run: pnpm buildStandalone

      - name: TypeScript validation
        if: steps.gate.outputs.build == 'true'
        run: pnpm testTsc

      - name: Lint and formatting validation
        if: steps.gate.outputs.build == 'true'
        run: |
          # Keep upstream source lint strict while excluding maintained fork
          # plugins with legacy lint debt and the local merge helpers.
          pnpm lint --ignore-pattern 'src/userplugins/**' --ignore-pattern 'scripts/mergePackageJson.mjs' --ignore-pattern 'scripts/mergePnpmWorkspace.mjs' --ignore-pattern 'scripts/merge-constants.js'
          # Format maintained files (workflows, package.json, workspace, stylesheet).
          # oxfmt rewrites in place; workflows are restored below so the sync
          # does not rewrite fork-managed Actions files.
          pnpm exec oxfmt .github/workflows/sync-upstream-release.yml .github/workflows/publish.yml .github/workflows/reportBrokenPlugins.yml pnpm-workspace.yaml package.json src/userplugins/passwordManager/styles.css
          # Upstream CSS currently has 37 pre-existing Stylelint violations under
          # the fork's preserved config. Validate the maintained fork stylesheet
          # here without rewriting unrelated upstream plugin CSS.
          pnpm exec stylelint src/userplugins/passwordManager/styles.css
          pnpm lint:intl
          pnpm lint:patches
          # Formatting is normalized on the maintained files above,
          # but keep fork-managed Actions files unchanged in the pushed commit.
          git restore --source="${GITHUB_SHA}" -- .github/workflows

      - name: Build web artifacts
        if: steps.gate.outputs.build == 'true'
        run: pnpm buildWebStandalone

      - name: Generate release metadata
        if: steps.gate.outputs.build == 'true'
        run: |
          pnpm generatePluginJson dist/plugins.json
          pnpm generateEquicordPluginJson dist/equicordplugins.json
          pnpm generateVencordPluginJson dist/vencordplugins.json
          pnpm generateDevsList dist/devs.json

      - name: Create browser extension source archive
        if: steps.gate.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f dist/extension-sources.zip
          zip -q -r dist/extension-sources.zip . \
            -x "node_modules/*" \
            -x "dist/*" \
            -x ".git/*"

      - name: Push validated upstream merge, lockfile and formatting fixes
        if: steps.gate.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git add .stylelintrc.json package.json src/userplugins/passwordManager/styles.css pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "Apply validated formatting and dependency lockfile updates"
          fi

          SHA="$(git rev-parse HEAD)"
          git push origin HEAD:main

          {
            echo "## Validated upstream sync pushed"
            echo
            echo "Commit: $SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect release files
        if: steps.gate.outputs.build == 'true'
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "dist" ]; then
            echo "::error::The dist directory was not created."
            exit 1
          fi

          SHA="$(git rev-parse HEAD)"
          SHORT_SHA="$(git rev-parse --short=8 HEAD)"
          VERSION="$(node -p "require('./package.json').version")"
          TAG="build-v${VERSION}-${SHORT_SHA}-${GITHUB_RUN_NUMBER}"

          rm -rf release
          mkdir -p release

          # Desktop app (packaged as asar) -> desktop.zip
          if [ -f "dist/desktop.asar" ]; then
            ( cd dist && zip -9 -q -r "../release/desktop.zip" desktop.asar )
          fi

          # Equibop app (packaged as asar) -> equibop.zip
          if [ -f "dist/equibop.asar" ]; then
            ( cd dist && zip -9 -q -r "../release/equibop.zip" equibop.asar )
          fi

          # Equicord user script -> Equicord.user.zip
          if [ -f "dist/Equicord.user.js" ]; then
            ( cd dist && zip -9 -q -r "../release/Equicord.user.zip" Equicord.user.js )
          fi

          # Browser extensions -> extension-chrome.zip / extension-firefox.zip
          cp -f dist/extension-chrome.zip release/extension-chrome.zip 2>/dev/null || true
          cp -f dist/extension-firefox.zip release/extension-firefox.zip 2>/dev/null || true

          if [ -z "$(ls -A release)" ]; then
            echo "::error::No release files were generated."
            exit 1
          fi

          echo
          echo "Release files:"
          ls -lh release/

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          {
            echo "## Validated build completed"
            echo
            echo "- Version: $VERSION"
            echo "- Commit: $SHA"
            echo "- Tag: $TAG"
            echo
            echo "### Release files"
            echo
            for file in release/*; do
              echo "- $(basename "$file")"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub build release
        if: steps.gate.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Chaython/EquicordPlus
          TAG: ${{ steps.release.outputs.tag }}
          SHA: ${{ steps.release.outputs.sha }}
          VERSION: ${{ steps.release.outputs.version }}
          SHORT_SHA: ${{ steps.release.outputs.short_sha }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --repo "$GH_REPO" --clobber
          else
            gh release create "$TAG" \
              release/* \
              --repo "$GH_REPO" \
              --target "$SHA" \
              --title "EquicordPlus v${VERSION} (${SHORT_SHA})" \
              --notes "Automated validated EquicordPlus build from commit ${SHA}.

          Validation/build commands:
          - pnpm install --frozen-lockfile
          - pnpm buildStandalone
          - pnpm buildWebStandalone
          - plugin metadata generation

          TypeScript and lint diagnostics also run separately and are reported without blocking artifacts while the fork's existing diagnostics are being cleaned up."
          fi

      - name: Check whether browser stores need a version release
        if: steps.gate.outputs.build == 'true'
        id: browser_release
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_TAG="v$(node -p "require('./package.json').version")"
          LATEST_TAG="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"

          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi

          PUBLISH=false
          if [ "$PACKAGE_TAG" != "$LATEST_TAG" ] &&
             [ "$(printf '%s\n%s\n' "$LATEST_TAG" "$PACKAGE_TAG" | sort -V | tail -n 1)" = "$PACKAGE_TAG" ]; then
            PUBLISH=true
          fi

          echo "package_tag=$PACKAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

          {
            echo
            echo "## Browser store decision"
            echo
            echo "- Package tag: $PACKAGE_TAG"
            echo "- Latest version tag: $LATEST_TAG"
            echo "- Publish browser extension: $PUBLISH"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check browser publishing credentials
        if: steps.browser_release.outputs.publish == 'true' && vars.ACT != 'true'
        id: browser_credentials
        shell: bash
        env:
          CHROME_API_VERSION: ${{ secrets.CHROME_API_VERSION }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          FIREFOX_COMPATIBILITY: ${{ secrets.FIREFOX_COMPATIBILITY }}
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          set -euo pipefail

          REQUIRED_SECRETS=(
            CHROME_API_VERSION
            CHROME_EXTENSION_ID
            CHROME_PUBLISHER_ID
            CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL
            CHROME_SERVICE_ACCOUNT_PRIVATE_KEY
            EDGE_API_KEY
            EDGE_PRODUCT_ID
            EDGE_CLIENT_ID
            FIREFOX_COMPATIBILITY
            FIREFOX_EXTENSION_ID
            FIREFOX_JWT_ISSUER
            FIREFOX_JWT_SECRET
          )

          MISSING=()
          for name in "${REQUIRED_SECRETS[@]}"; do
            if [ -z "${!name:-}" ]; then
              MISSING+=("$name")
            fi
          done

          if [ "${#MISSING[@]}" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "All browser-store publishing credentials are configured."
            {
              echo
              echo "## Browser publishing credentials"
              echo
              echo "All required Chrome, Firefox, and Edge credentials are configured."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Browser-store publishing skipped because required repository secrets are missing."
            {
              echo
              echo "## Browser publishing skipped"
              echo
              echo "The build and GitHub release succeeded, but browser-store publishing was skipped."
              echo "Configure all required Chrome, Firefox, and Edge repository secrets to enable automatic store publishing."
              echo
              echo "Missing secrets:"
              for name in "${MISSING[@]}"; do
                echo "- `$name`"
              done
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish validated browser extension
        id: publish_browser
        if: steps.browser_release.outputs.publish == 'true' && steps.browser_credentials.outputs.ready == 'true' && vars.ACT != 'true'
        continue-on-error: true
        run: |
          pnpx @equicord/publish-browser-extension@latest \
            --chrome-zip dist/extension-chrome.zip \
            --firefox-zip dist/extension-firefox.zip \
            --firefox-sources-zip dist/extension-sources.zip \
            --edge-zip dist/extension-chrome.zip
        env:
          CHROME_API_VERSION: ${{ secrets.CHROME_API_VERSION }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          FIREFOX_COMPATIBILITY: ${{ secrets.FIREFOX_COMPATIBILITY }}
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}

      - name: Tag successfully published browser version
        if: steps.browser_release.outputs.publish == 'true' && steps.browser_credentials.outputs.ready == 'true' && steps.publish_browser.outcome == 'success' && vars.ACT != 'true'
        shell: bash
        env:
          PACKAGE_TAG: ${{ steps.browser_release.outputs.package_tag }}
        run: |
          set -euo pipefail
          git tag "$PACKAGE_TAG" "$(git rev-parse HEAD)"
          git push origin "$PACKAGE_TAG"


      - name: Report optional browser publishing result
        if: always() && steps.browser_release.outputs.publish == 'true'
        shell: bash
        env:
          CREDENTIALS_READY: ${{ steps.browser_credentials.outputs.ready }}
          PUBLISH_OUTCOME: ${{ steps.publish_browser.outcome }}
        run: |
          {
            echo
            echo "## Optional browser publishing result"
            echo
            if [ "$CREDENTIALS_READY" != "true" ]; then
              echo "Browser-store publishing was skipped because credentials are not configured. This does not affect build success."
            elif [ "$PUBLISH_OUTCOME" = "success" ]; then
              echo "Browser-store publishing completed successfully."
            else
              echo "::warning::Browser-store publishing did not complete successfully. The validated build and GitHub release remain successful."
              echo "Browser-store publishing did not complete successfully. This optional step is non-blocking; the validated build and GitHub release remain successful."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
